<svg viewBox="0 0 1500 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#4b5468" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#c99a2e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="1500" height="900" fill="#0a0e1a"/>

<text x="40" y="55" font-size="30" font-weight="700" fill="#f5f6fa">Your Claude + Codex Setup</text>
<text x="40" y="82" font-size="15" fill="#b794f6">Shared instructions &#183; two control planes, one shared set of subagents</text>
<text x="40" y="112" font-size="12" fill="#8b93a7">Main session for everyday work on either tool,</text>
<text x="40" y="130" font-size="12" fill="#8b93a7">one shared set of three specialist roles underneath,</text>
<text x="40" y="148" font-size="12" fill="#8b93a7">but Codex subagents only spawn when explicitly asked.</text>

<!-- Shared files panel -->
<rect x="20" y="210" width="300" height="195" rx="10" fill="#11151f" stroke="#232838"/>
<text x="40" y="238" font-size="13" font-weight="700" letter-spacing="1" fill="#c9a8f0">SHARED FILES</text>

<rect x="40" y="255" width="260" height="130" rx="8" fill="#1f1730" stroke="#7c4fd6" stroke-width="1.2"/>
<text x="58" y="280" font-size="15" font-weight="700" fill="#e6d9ff">AGENTS.md</text>
<text x="58" y="298" font-size="11" font-style="italic" fill="#b794f6">canonical &#183; project root</text>
<text x="58" y="320" font-size="12" fill="#c7ccd6">&#8226; Source of truth for instructions</text>
<text x="58" y="338" font-size="12" fill="#c7ccd6">&#8226; Read natively by Codex, imported into CLAUDE.md</text>
<text x="58" y="360" font-size="12" fill="#c7ccd6">&#8226; Generated by /project-init or $project-init</text>

<!-- Skills & rules column -->
<rect x="20" y="430" width="300" height="430" rx="10" fill="#11151f" stroke="#232838"/>
<text x="40" y="456" font-size="13" font-weight="700" letter-spacing="1" fill="#c9a8f0">SKILLS &amp; RULES</text>

<rect x="40" y="475" width="260" height="100" rx="8" fill="#161a24" stroke="#2a3040"/>
<text x="56" y="498" font-size="13" font-weight="700" fill="#cfd4e0">.agents/rules/always/</text>
<text x="56" y="516" font-size="11" fill="#8b93a7">Loaded every session</text>
<text x="56" y="536" font-size="11" fill="#8b93a7">core.md, specs.md</text>
<text x="56" y="558" font-size="10" fill="#5d6478">Kept short &#8212; it's read on every turn</text>

<rect x="40" y="590" width="260" height="100" rx="8" fill="#161a24" stroke="#2a3040"/>
<text x="56" y="613" font-size="13" font-weight="700" fill="#cfd4e0">.agents/rules/on-demand/</text>
<text x="56" y="631" font-size="11" fill="#8b93a7">Loaded when a trigger matches</text>
<text x="56" y="651" font-size="11" fill="#8b93a7">code-style.md, architecture.md</text>
<text x="56" y="673" font-size="10" fill="#5d6478">AGENTS.md's load table names the trigger</text>

<rect x="40" y="705" width="260" height="100" rx="8" fill="#161a24" stroke="#2a3040"/>
<text x="56" y="728" font-size="13" font-weight="700" fill="#cfd4e0">.agents/skills/</text>
<text x="56" y="746" font-size="11" fill="#8b93a7">One shared pool, one copy on disk</text>
<text x="56" y="766" font-size="11" fill="#8b93a7">Native for Codex, symlinked for Claude</text>
<text x="56" y="788" font-size="10" fill="#5d6478">docs-incode, test-unit, test-integration&#8230;</text>

<text x="40" y="828" font-size="11" font-style="italic" fill="#b794f6">Works with or without specs/ &#8212;</text>
<text x="40" y="846" font-size="11" font-style="italic" fill="#b794f6">specs/ layers spec-awareness on top.</text>

<!-- YOU node -->
<rect x="850" y="20" width="140" height="44" rx="8" fill="#1a1f2b" stroke="#454c5f"/>
<text x="920" y="47" text-anchor="middle" font-size="14" font-weight="700" fill="#e8ebf0">YOU</text>
<path d="M920 64 C 920 90, 760 90, 760 108" fill="none" stroke="#4b5468" stroke-width="2" marker-end="url(#ah)"/>
<path d="M920 64 C 920 90, 1080 90, 1080 108" fill="none" stroke="#4b5468" stroke-width="2" marker-end="url(#ah)"/>

<!-- Claude Code tool box -->
<rect x="630" y="110" width="260" height="90" rx="10" fill="#12233f" stroke="#2f6fd6" stroke-width="1.2"/>
<text x="650" y="132" font-size="10" font-weight="700" letter-spacing="1" fill="#6ea8fe">PRIMARY AGENT</text>
<text x="650" y="156" font-size="18" font-weight="700" fill="#eaf1ff">Claude Code</text>
<text x="650" y="174" font-size="11" font-style="italic" fill="#6ea8fe">model: session default</text>
<text x="650" y="192" font-size="12" fill="#c7ccd6">Delegates via Task tool &#8212; fires automatically</text>

<!-- Codex CLI tool box -->
<rect x="950" y="110" width="260" height="90" rx="10" fill="#241a10" stroke="#c99a2e" stroke-width="1.2"/>
<text x="970" y="132" font-size="10" font-weight="700" letter-spacing="1" fill="#e8c565">MIRRORED CONTROL PLANE</text>
<text x="970" y="156" font-size="18" font-weight="700" fill="#fff3da">Codex CLI</text>
<text x="970" y="174" font-size="11" font-style="italic" fill="#e8c565">openai/codex</text>
<text x="970" y="192" font-size="12" fill="#e8ddc8">Own config.toml &#8212; subagents only when asked</text>

<!-- manual switch between tools -->
<path d="M890 155 L950 155" fill="none" stroke="#454c5f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="893" y="145" font-size="10" fill="#8b93a7">manual switch</text>

<!-- Each service's own line merges into one shared line feeding the subagent row -->
<line x1="760" y1="200" x2="760" y2="300" stroke="#4b5468" stroke-width="2"/>
<text x="760" y="222" text-anchor="middle" font-size="10" letter-spacing="1" fill="#8b93a7">AUTO-DELEGATED</text>

<line x1="1080" y1="200" x2="1080" y2="300" stroke="#c99a2e" stroke-width="2" stroke-dasharray="4 3"/>
<text x="1080" y="222" text-anchor="middle" font-size="10" letter-spacing="1" fill="#e8c565">EXPLICIT ASK ONLY</text>

<line x1="760" y1="300" x2="1080" y2="300" stroke="#4b5468" stroke-width="2"/>
<line x1="920" y1="300" x2="920" y2="380" stroke="#4b5468" stroke-width="2" marker-end="url(#ah)"/>

<!-- SUBAGENTS: one shared set, fed by both tools -->
<text x="920" y="355" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#c9a8f0">SUBAGENTS &#8212; ONE SHARED SET</text>

<!-- Architect card -->
<rect x="360" y="380" width="360" height="240" rx="12" fill="#1f1730" stroke="#7c4fd6" stroke-width="1.4"/>
<text x="380" y="410" font-size="20" font-weight="700" fill="#e6d9ff">Architect</text>
<text x="380" y="438" font-size="13" fill="#c7ccd6">Design &amp; judgement</text>
<text x="380" y="458" font-size="13" fill="#c7ccd6">Multi-file changes</text>
<text x="380" y="478" font-size="13" fill="#c7ccd6">New modules</text>
<line x1="378" y1="490" x2="702" y2="490" stroke="#3a4155" stroke-width="1"/>
<line x1="540" y1="500" x2="540" y2="610" stroke="#3a4155" stroke-width="1"/>
<text x="380" y="530" font-size="10" font-weight="700" letter-spacing="1" fill="#b794f6">CLAUDE</text>
<text x="380" y="552" font-size="12" font-style="italic" fill="#e6d9ff">opus</text>
<text x="380" y="574" font-size="9" fill="#8b93a7">Read/Grep/Glob/WebFetch/Edit</text>
<text x="552" y="530" font-size="10" font-weight="700" letter-spacing="1" fill="#b794f6">CODEX</text>
<text x="552" y="552" font-size="12" font-style="italic" fill="#e6d9ff">gpt-5.5 &#183; high</text>
<text x="552" y="574" font-size="9" fill="#8b93a7">sandbox: workspace-write</text>

<!-- Runner card -->
<rect x="740" y="380" width="360" height="240" rx="12" fill="#0f2a26" stroke="#1f9d7c" stroke-width="1.4"/>
<text x="760" y="410" font-size="20" font-weight="700" fill="#c7f5e6">Runner</text>
<text x="760" y="438" font-size="13" fill="#c7ccd6">Runs build/lint/tests</text>
<text x="760" y="458" font-size="13" fill="#c7ccd6">Reports only failures</text>
<text x="760" y="478" font-size="13" fill="#c7ccd6">Not for writing code</text>
<line x1="758" y1="490" x2="1082" y2="490" stroke="#3a4155" stroke-width="1"/>
<line x1="920" y1="500" x2="920" y2="610" stroke="#3a4155" stroke-width="1"/>
<text x="760" y="530" font-size="10" font-weight="700" letter-spacing="1" fill="#4fd1a5">CLAUDE</text>
<text x="760" y="552" font-size="12" font-style="italic" fill="#c7f5e6">haiku</text>
<text x="760" y="574" font-size="9" fill="#8b93a7">Read/Bash</text>
<text x="932" y="530" font-size="10" font-weight="700" letter-spacing="1" fill="#4fd1a5">CODEX</text>
<text x="932" y="552" font-size="12" font-style="italic" fill="#c7f5e6">gpt-5.3-spark &#183; low</text>
<text x="932" y="574" font-size="9" fill="#8b93a7">sandbox: workspace-write</text>

<!-- Test writer card -->
<rect x="1120" y="380" width="360" height="240" rx="12" fill="#2a1712" stroke="#d9713f" stroke-width="1.4"/>
<text x="1140" y="410" font-size="20" font-weight="700" fill="#ffe3d0">Test writer</text>
<text x="1140" y="438" font-size="13" fill="#c7ccd6">New public surface</text>
<text x="1140" y="458" font-size="13" fill="#c7ccd6">Unit + edge cases</text>
<text x="1140" y="478" font-size="13" fill="#c7ccd6">Runs tests before done</text>
<line x1="1138" y1="490" x2="1462" y2="490" stroke="#3a4155" stroke-width="1"/>
<line x1="1300" y1="500" x2="1300" y2="610" stroke="#3a4155" stroke-width="1"/>
<text x="1140" y="530" font-size="10" font-weight="700" letter-spacing="1" fill="#f4a875">CLAUDE</text>
<text x="1140" y="552" font-size="12" font-style="italic" fill="#ffe3d0">sonnet</text>
<text x="1140" y="574" font-size="9" fill="#8b93a7">Read/Grep/Glob/Edit/Bash</text>
<text x="1312" y="530" font-size="10" font-weight="700" letter-spacing="1" fill="#f4a875">CODEX</text>
<text x="1312" y="552" font-size="12" font-style="italic" fill="#ffe3d0">gpt-5.5 &#183; medium</text>
<text x="1312" y="574" font-size="9" fill="#8b93a7">sandbox: workspace-write</text>

<!-- Usage principles panel (widened to fill the row alone) -->
<rect x="340" y="660" width="1140" height="200" rx="10" fill="#11151f" stroke="#232838"/>
<text x="360" y="686" font-size="13" font-weight="700" letter-spacing="1" fill="#6ea8fe">USAGE PRINCIPLES</text>
<text x="360" y="712" font-size="12" fill="#c7ccd6">&#10003; Start with either main session for normal work</text>
<text x="360" y="736" font-size="12" fill="#c7ccd6">&#10003; Claude subagents fire automatically on a description match</text>
<text x="360" y="760" font-size="12" fill="#c7ccd6">&#10003; Codex subagents only run when explicitly asked to spawn</text>
<text x="360" y="784" font-size="12" fill="#c7ccd6">&#10003; Keep AGENTS.md as the single source of truth</text>
<text x="360" y="808" font-size="12" fill="#c7ccd6">&#10003; Mirror .claude/agents/*.md &#8596; .codex/agents/*.toml by hand</text>
</svg>
